{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="form-card">
  <h1 id="page-title">Create account</h1>
  <form method="post" action="{{ url_for('register') }}">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <label for="reg-username">Username</label>
    <input type="text" id="reg-username" name="username" value="{{ username }}" required minlength="3" maxlength="30">

    <label for="reg-email">Email</label>
    <input type="email" id="reg-email" name="email" value="{{ email }}" required>

    <label for="reg-password">Password</label>
    <input type="password" id="reg-password" name="password" required minlength="6">

    <label for="reg-confirm">Confirm password</label>
    <input type="password" id="reg-confirm" name="confirm" required minlength="6">

    <button type="submit" id="reg-submit" class="btn btn-block">Register</button>
  </form>
  <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
